function norm360(x){return((x%360)+360)%360;}
function helioXYZ(el,T,Mo=null){
 const a=el.a[0]+el.a[1]*T,e=el.e[0]+el.e[1]*T,I=(el.I[0]+el.I[1]*T)*D2R;
 const L=el.L[0]+el.L[1]*T,wbar=el.w[0]+el.w[1]*T,N=(el.N[0]+el.N[1]*T)*D2R,w=(wbar*D2R)-N;
 let M=Mo!==null?Mo:norm360(L-wbar)*D2R,E=M+e*Math.sin(M);
 for(let i=0;i<10;i++)E=E-(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));
 const xv=a*(Math.cos(E)-e),yv=a*Math.sqrt(1-e*e)*Math.sin(E),v=Math.atan2(yv,xv),r=Math.hypot(xv,yv),u=v+w;
 const cu=Math.cos(u),su=Math.sin(u),cN=Math.cos(N),sN=Math.sin(N),cI=Math.cos(I),sI=Math.sin(I);
 return[r*(cN*cu-sN*su*cI),r*(sN*cu+cN*su*cI),r*su*sI];
}
const eclToEq=([x,y,z])=>[x,y*Math.cos(OBL)-z*Math.sin(OBL),y*Math.sin(OBL)+z*Math.cos(OBL)];
function raDec(v){const r=Math.hypot(v[0],v[1],v[2]);return{ra:norm360(Math.atan2(v[1],v[0])*R2D),dec:Math.asin(v[2]/r)*R2D,dist:r};}
function altAz(raD,decD,ms,latD,lonD){
 const d=daysSince(ms),lst=norm360(280.46061837+360.98564736629*d+lonD);
 const H=(lst-raD)*D2R,phi=latD*D2R,dec=decD*D2R;
 const alt=Math.asin(Math.sin(phi)*Math.sin(dec)+Math.cos(phi)*Math.cos(dec)*Math.cos(H))*R2D;
 const azS=Math.atan2(Math.sin(H),Math.cos(H)*Math.sin(phi)-Math.tan(dec)*Math.cos(phi))*R2D;
 return{alt,az:norm360(azS+180)};
}

 const sunEq=raDec(eclToEq(sunGeo));
 const sun={name:"Sun",...sunEq,...altAz(sunEq.ra,sunEq.dec,ms,latD,lonD),eclLon:norm360(Math.atan2(sunGeo[1],sunGeo[0])*R2D)};

  const h=helioXYZ(p.el,T);
  if(i===2)return{...p,helio:h,isEarth:true};
  const g=[h[0]-earth[0],h[1]-earth[1],h[2]-earth[2]],eq=raDec(eclToEq(g)),aa=altAz(eq.ra,eq.dec,ms,latD,lonD);
  const eclLon=norm360(Math.atan2(g[1],g[0])*R2D);
  const dot=(g[0]*sunGeo[0]+g[1]*sunGeo[1]+g[2]*sunGeo[2])/(eq.dist*Math.hypot(...sunGeo));
  return{...p,helio:h,geo:g,...eq,...aa,eclLon,elong:Math.acos(Math.max(-1,Math.min(1,dot)))*R2D};
 });
 const d=daysSince(ms),Lm=(218.316+13.176396*d)*D2R,Mm=(134.963+13.064993*d)*D2R,F=(93.272+13.22935*d)*D2R;
 const lam=Lm+6.289*D2R*Math.sin(Mm),bet=5.128*D2R*Math.sin(F);

 const moon={name:"Moon",...mEq,...altAz(mEq.ra,mEq.dec,ms,latD,lonD),eclLon:moonLon,phase,illum:(1-Math.cos(phase*D2R))/2};
 return{earth,sun,moon,planets,T};
}

// find evening astronomical twilight for a given calendar date + place.
// Works in longitude-based local solar time so it's correct for any place on Earth,
// independent of the browser's own timezone.
function findDarkMoment(baseMs,latD,lonD){

 // UTC midnight of the date, then shift by the longitude offset (lon/15 hours).

 const lonOffsetMs=(lonD/15)*3600000; // east-positive hours from UTC
 const localNoonUTC=utcMidnight+12*3600000-lonOffsetMs; // ~local solar noon in real UTC
 // scan local solar 18:00 → 02:00 (i.e. +6h to +14h past local noon)
 let best=localNoonUTC+8*3600000,bestErr=1e9,darkest=null,darkestAlt=99;
 for(let h=6;h<=14;h+=10/60){
  const t=localNoonUTC+h*3600000;
  const st=skyState(t,latD,lonD);
  if(st.sun.alt<darkestAlt){darkestAlt=st.sun.alt;darkest=t;}
  const err=Math.abs(st.sun.alt-(-15));
  if(st.sun.alt<-6&&err<bestErr){bestErr=err;best=t;}

 // fall back to the darkest moment of the night so it's still as dark as it gets.
 if(bestErr>30)return darkest!==null?darkest:best;

}

// pick the azimuth to face: the center of the densest clump of planets above the horizon.
// returns {az, note} — az in degrees, note describing what's there.
function bestLookAz(ms,latD,lonD){

  let bestAz=180,bestAlt=-99;
  for(let L=0;L<360;L+=4){const eq=raDec(eclToEq([Math.cos(L*D2R),Math.sin(L*D2R),0])),aa=altAz(eq.ra,eq.dec,ms,latD,lonD);if(aa.alt>bestAlt){bestAlt=aa.alt;bestAz=aa.az;}}

    camera.up.copy(new THREE.Vector3(0,1,0).lerp(zenithScene,easeInOut(Math.min(1,raw*1.2))).normalize());
    // LOOK: ease from the system centre to a far point along the TRUE gaze direction
    const skyLook=earth.clone().add(gazeDir.clone().multiplyScalar(60));
    const lookPt=new THREE.Vector3().lerpVectors(new THREE.Vector3(0,0,0),skyLook,easeInOut(Math.min(1,raw*1.15)));
    camera.lookAt(lookPt);
    camera.fov=camFOVstart+(camFOVend-camFOVstart)*k;camera.updateProjectionMatrix();
    // PLANETS: shrink, and settle from compressed-model directions onto TRUE geocentric directions,
    // so by the cut each planet sits exactly where the real sky puts it.
    const shrink=1-0.82*k, settle=easeInOut(k);
    meshes.forEach((m,i)=>{
     m.scale.setScalar(shrink);
     if(i===2){m.position.copy(basePos[i]);m.visible=raw<0.85;return;} // Earth: hide as we land on it
     const dir=new THREE.Vector3().lerpVectors(dirComp[i],dirTrue[i],settle).normalize();
     m.position.copy(earth.clone().add(dir.multiplyScalar(distE[i])));
    });
    orbitLines.forEach(ol=>ol.material.opacity=0.4*(1-k*0.85)); // orbits fade — they'd look wrong from inside
    labels.forEach((l,i)=>{const m=meshes[i];l.position.set(m.position.x,m.position.y+1.3*m.scale.x,m.position.z);l.material.opacity=i===2?Math.max(0,1-raw*2):Math.max(0,1-k*1.3);});
    grid.material.opacity=0.45*(1-k*0.6);
    if(raw<0.4)setCaption(`Falling toward Earth — ${placeName}.`);
    else if(raw<0.8)setCaption(lookNote?`Turning to ${compass16(lookAz)} — ${lookNote}.`:`Turning to ${compass16(lookAz)}.`);
    else setCaption("Crossing into the night sky…");
    const fadeStart=0.78;
    const fa=raw>fadeStart?Math.min(1,(raw-fadeStart)/(1-fadeStart)):0;
    if(skyRef.current){skyRef.current.style.opacity=fa;if(fa>0)drawSky(1);}
    renderer.domElement.style.opacity=1-fa*0.92;
    if(p>=1){if(skyRef.current)skyRef.current.style.opacity=1;drawSky(1);renderer.domElement.style.opacity=0.08;}
   }
  };

  const render=(now)=>{
   if(mode==="fly"){
    if(t0===null)t0=now;
    const total=holdRot+flyDur,el=(now-t0)/1000,p=el/total;
    if(p>=1){frame(1);mode="done";ctrl.current.playing=false;setPhase("landed");setCaption("");onProgress(1);renderer.render(scene,camera);raf=requestAnimationFrame(render);return;}
    frame(p);onProgress(p);
   }else if(mode==="idle"){
    idleTheta+=0.0014;camera.fov=camFOVstart;camera.updateProjectionMatrix();
    meshes.forEach(m=>m.scale.setScalar(1));labels.forEach((l,i)=>l.material.opacity=i===2?1:0.62);
    setCam(idleTheta,Math.PI/2-TILT,startR,new THREE.Vector3(0,0,0));
   }else if(mode==="scrub"||mode==="done"){
    renderer.render(scene,camera);raf=requestAnimationFrame(render);return;
   }
   renderer.render(scene,camera);raf=requestAnimationFrame(render);
  };
  mode="idle";raf=requestAnimationFrame(render);

  mount._startFly=()=>{t0=null;mode="fly";ctrl.current.playing=true;setPhase("flying");grid.material.opacity=0.45;meshes.forEach(m=>m.scale.setScalar(1));labels.forEach((l,i)=>l.material.opacity=i===2?1:0.62);if(skyRef.current)skyRef.current.style.opacity=0;renderer.domElement.style.opacity=1;};
  mount._scrubTo=(p)=>{mode="scrub";ctrl.current.playing=false;setPhase(p>=1?"landed":"flying");frame(p);renderer.render(scene,camera);if(p>=1)mode="done";};

  const ro=new ResizeObserver(()=>{const w=mount.clientWidth;renderer.setSize(w,H);camera.aspect=w/H;camera.updateProjectionMatrix();});ro.observe(mount);
  return()=>{cancelAnimationFrame(raf);ro.disconnect();renderer.dispose();if(renderer.domElement.parentNode)mount.removeChild(renderer.domElement);};
 },[lat,lon,timeMs,placeName,lookAz,lookNote,drawSky]);

 const start=()=>{const m=mountRef.current;if(m&&m._startFly){setScrub(0);m._startFly();}};
 const onScrubInput=(v)=>{scrubbingRef.current=true;ctrl.current.playing=false;setScrub(v);const m=mountRef.current;if(m&&m._scrubTo)m._scrubTo(v);};
 const onScrubRelease=()=>{scrubbingRef.current=false;};

 return(

   </div>
  </div>
 );
}

  window.addEventListener("deviceorientationabsolute",handler,true);

  const chk=setTimeout(()=>{if(!compassGotEvent.current){setCompassOn(false);alert("No compass data is arriving. On iPhone this usually means the page isn't on https:// — opening the file directly (file://) blocks the sensor. Host it on a secure URL, or just use swipe / due-south.");}},1500);

         </div>
         <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(110px,1fr))",gap:8,marginTop:10}}>
          {cat&&<div><div style={{fontSize:10,letterSpacing:1.5,color:C.dim}}>DISTANCE</div><div style={{fontFamily:"ui-monospace,monospace",fontSize:14,color:C.cream}}>{cat.dist.toLocaleString()} ly</div></div>}
          {f&&<div><div style={{fontSize:10,letterSpacing:1.5,color:C.dim}}>SIZE</div><div style={{fontFamily:"ui-monospace,monospace",fontSize:14,color:C.cream}}>{f.radius}</div></div>}
          {f&&<div><div style={{fontSize:10,letterSpacing:1.5,color:C.dim}}>LUMINOSITY</div><div style={{fontFamily:"ui-monospace,monospace",fontSize:14,color:C.cream}}>{f.lum}</div></div>}
          {cat&&<div><div style={{fontSize:10,letterSpacing:1.5,color:C.dim}}>MAGNITUDE</div><div style={{fontFamily:"ui-monospace,monospace",fontSize:14,color:C.cream}}>{cat.mag.toFixed(2)}</div></div>}
         </div>
         {f&&<div style={{fontSize:13,color:C.cream,fontStyle:"italic",lineHeight:1.5,marginTop:10}}>{f.fact}</div>}
         <a href={`https://en.wikipedia.org/wiki/${f?f.wiki:encodeURIComponent(selStar)}`} target="_blank" rel="noopener noreferrer" style={{display:"inline-block",marginTop:10,color:C.brass,fontSize:13,textDecoration:"none",borderBottom:`1px solid ${C.brass}66`}}>Learn more on Wikipedia →</a>
        </div>
       );
      })()}
      {/* constellation story card */}
      {skyMode==="stars"&&selConst&&FEATURED[selConst]&&(()=>{
       const f=FEATURED[selConst];
       const dists=f.stars.map(n=>starByName[n]).filter(Boolean).map(s=>s.dist);
       const lo=Math.min(...dists),hi=Math.max(...dists);
       return(
        <div style={{marginTop:10,background:C.panel2,border:`1px solid #5b86c455`,borderRadius:12,padding:"12px 14px",position:"relative"}}>
         <button onClick={()=>setSelConst(null)} aria-label="Close constellation details" style={{position:"absolute",top:8,right:10,background:"none",border:"none",color:C.dim,fontSize:16,cursor:"pointer"}}>×</button>
         <div style={{display:"flex",alignItems:"baseline",gap:10,flexWrap:"wrap"}}>
          <span style={{fontSize:19,color:"#9dbdf0"}}>{selConst}</span>
          <span style={{fontSize:11,color:C.dim,fontFamily:"ui-monospace,monospace"}}>{f.stars.length} stars · {lo.toLocaleString()}–{hi.toLocaleString()} ly deep</span>
         </div>
         <div style={{fontSize:13,color:C.cream,fontStyle:"italic",lineHeight:1.5,marginTop:8}}>{f.blurb}</div>
         <button onClick={()=>{setConKey(selConst);setMorph(0);setMorphPlay(false);setTab("depth");}} style={{marginTop:10,background:"#1a2440",color:"#9dbdf0",border:"1px solid #5b86c455",borderRadius:8,padding:"7px 12px",fontSize:13,fontFamily:"Georgia,serif",cursor:"pointer"}}>Unstack it in the depth view →</button>
        </div>
       );
      })()}
      <div style={{marginTop:10}}>{TimeStepper()}</div>
      {skyMode==="planets"&&<label style={{fontSize:12,color:C.dim,display:"flex",gap:6,alignItems:"center",marginTop:8}}>
       <input type="checkbox" checked={showTrail} onChange={e=>setShowTrail(e.target.checked)} style={{accentColor:C.brass}}/> trace {selected}'s path vs. stars (Mars near opp. → retrograde loop)
      </label>}
      {skyMode==="stars"&&!selStar&&!selConst&&<div style={{fontSize:12,color:C.dim,marginTop:8,fontStyle:"italic"}}>Every star is tappable — the ten brightest are haloed and named. Tap a constellation's name for its story.</div>}
     </div>}

     <div style={panel}>
      <Plate right="tap to select">TONIGHT'S REPORT</Plate>
      {bodies.map((b,bi)=>(
       <div key={b.name} onClick={()=>setSelected(b.name)} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 8px",borderRadius:8,cursor:"pointer",background:selected===b.name?"#1c2848":"transparent",borderTop:bi>0?`1px solid ${C.line}44`:"none"}}>
        <span style={{width:10,height:10,borderRadius:6,background:b.color,flexShrink:0,boxShadow:`0 0 8px ${b.color}`}}/>
        <span style={{width:66,fontSize:14}}>{b.name}</span>
        <span style={{fontSize:12,color:b.sc,flex:1}}>{b.status}</span>
        <span style={{fontSize:11,color:C.dim,fontFamily:"ui-monospace,monospace"}}>{b.extra}</span>
       </div>
      ))}
     </div>
    </>}

    {tab==="fly"&&<>
     <div style={{background:C.panel,border:`1px solid ${C.line}`,borderRadius:14,padding:12,marginBottom:12}}>
      <Plate right="then take the ride">FLIGHT PLAN</Plate>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
       {PRESETS.map(p=>(<button key={p.name} style={{...chip(flyPlace.name===p.name)}} onClick={()=>setFlyPlace(p)}>{p.name}</button>))}
      </div>
      <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
       <span style={{fontSize:11,color:C.dim}}>latitude {flyPlace.lat.toFixed(1)}°</span>
       <input type="range" min={-55} max={66} step={0.5} value={flyPlace.lat} onChange={e=>setFlyPlace({name:"Custom",lat:+e.target.value,lon:flyPlace.lon})} style={{flex:1,minWidth:140,accentColor:C.brass}}/>
       <input type="date" value={(()=>{const d=new Date(flyDate);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;})()} style={{...btn(false),padding:"4px 8px"}} onChange={e=>{if(!e.target.value)return;const[y,m,dd]=e.target.value.split("-").map(Number);const d=new Date(flyDate);d.setFullYear(y,m-1,dd);setFlyDate(d.getTime());}}/>
      </div>

      {/* time of night */}
      <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",marginTop:12}}>
       <span style={{fontSize:11,color:C.dim,width:74}}>time of night</span>
       <button style={chip(flyTimeMode==="auto")} onClick={()=>setFlyTimeMode("auto")}>Auto (twilight)</button>
       <button style={chip(flyTimeMode==="now")} onClick={()=>setFlyTimeMode("now")}>Now</button>
       <button style={chip(flyTimeMode==="custom")} onClick={()=>setFlyTimeMode("custom")}>Custom</button>
      </div>
      {flyTimeMode==="custom"&&<div style={{display:"flex",gap:10,alignItems:"center",marginTop:6}}>
       <span style={{fontSize:11,color:C.dim,width:74}}>{String(Math.floor(flyHour)).padStart(2,"0")}:{String(Math.round((flyHour%1)*60)).padStart(2,"0")} local</span>
       <input type="range" min={17} max={29} step={0.25} value={flyHour} onChange={e=>setFlyHour(+e.target.value)} style={{flex:1,accentColor:C.brass}}/>
      </div>}

      {/* look direction */}
      <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",marginTop:10}}>
       <span style={{fontSize:11,color:C.dim,width:74}}>look toward</span>
       <button style={chip(flyDirMode==="auto")} onClick={()=>setFlyDirMode("auto")}>Auto (most planets)</button>
       <button style={chip(flyDirMode==="custom")} onClick={()=>setFlyDirMode("custom")}>Custom</button>
      </div>
      {flyDirMode==="custom"&&<div style={{display:"flex",gap:10,alignItems:"center",marginTop:6}}>
       <span style={{fontSize:11,color:C.dim,width:74}}>{compass16(flyAz)} {Math.round(flyAz)}°</span>
       <input type="range" min={0} max={359} step={1} value={flyAz} onChange={e=>setFlyAz(+e.target.value)} style={{flex:1,accentColor:C.brass}}/>
      </div>}

      <div style={{fontSize:11,color:C.dim,marginTop:10,fontStyle:"italic"}}>Auto lands at that evening’s astronomical twilight, facing wherever the most planets are up.</div>
     </div>
     {(()=>{
      // resolve the moment
      let moment;
      if(flyTimeMode==="now")moment=Date.now();
      else if(flyTimeMode==="custom"){
       const base=new Date(flyDate);
       const utcMid=Date.UTC(base.getFullYear(),base.getMonth(),base.getDate(),0,0,0);
       const lonOff=(flyPlace.lon/15)*3600000;
       moment=utcMid+flyHour*3600000-lonOff; // flyHour as local solar hour (17–29 = 5pm–5am)
      }else moment=findDarkMoment(flyDate,flyPlace.lat,flyPlace.lon);
      // resolve look azimuth
      const auto=bestLookAz(moment,flyPlace.lat,flyPlace.lon);
      const az=flyDirMode==="custom"?flyAz:auto.az;
      const note=flyDirMode==="custom"?null:auto.note;
      return(
       <FlyToEarth key={`${flyPlace.lat}_${flyPlace.lon}_${moment}_${az}`} lat={flyPlace.lat} lon={flyPlace.lon} timeMs={moment} placeName={flyPlace.name} lookAz={az} lookNote={note}
        onExplore={()=>{setLat(Math.round(flyPlace.lat));setTimeMs(moment);setSkyMode("planets");setCenterAz(az);setTab("explore");}}/>
      );
     })()}
     <div style={{textAlign:"center",fontSize:11,color:C.dim,marginTop:12,fontStyle:"italic"}}>The 3D camera turns to your chosen heading before the cut, so the model and the real horizon line up.</div>
    </>}

    {tab==="depth"&&<>
     <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12,justifyContent:"center"}}>
      {Object.keys(FEATURED).map(k=>(<button key={k} style={btn(conKey===k)} onClick={()=>{setConKey(k);setMorph(0);setMorphPlay(false);}}>{k}</button>))}
     </div>
     <div style={{background:C.panel,border:`1px solid ${C.line}`,borderRadius:14,padding:12}}>
      <Plate right="slide to unstack the constellation">LINE-OF-SIGHT DEPTH</Plate>
      <DepthView conKey={conKey} morph={morph} logScale={logScale}/>
      <div style={{display:"flex",gap:10,alignItems:"center",marginTop:12}}>
       <button style={btn(morphPlay)} onClick={()=>setMorphPlay(!morphPlay)}>{morphPlay?"❚❚":"▶"}</button>
       <span style={{fontSize:11,color:C.dim}}>sky</span>
       <input type="range" min={0} max={1} step={0.01} value={morph} onChange={e=>{setMorph(+e.target.value);setMorphPlay(false);}} style={{flex:1,accentColor:C.brass}}/>
       <span style={{fontSize:11,color:C.dim}}>depth</span>
      </div>
      <label style={{fontSize:12,color:C.dim,display:"flex",gap:6,alignItems:"center",marginTop:8}}><input type="checkbox" checked={logScale} onChange={e=>setLogScale(e.target.checked)} style={{accentColor:C.brass}}/> logarithmic distance scale</label>
      <div style={{marginTop:12,padding:12,background:C.panel2,borderRadius:10,fontSize:13.5,lineHeight:1.55}}>{FEATURED[conKey].blurb}</div>
     </div>
    </>}

    <div style={{textAlign:"center",fontSize:11,color:C.dim,marginTop:18,fontStyle:"italic"}}>
     Keplerian positions (J2000 + secular rates) · sizes compressed, not to scale · Moon ~1° · compass needs HTTPS/saved file + sensors.
    </div>
   </div>
  </div>
 );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
